<!DOCTYPE html>
<html>
<head>
    <title>tabel nilai mahasiswa</title>
</head>
<body>

    <h2>Tabel nilai mahasiswa</h2>

    <table border="1" cellpadding="8">
        <!-- header -->
         <thead>
            <tr>
                <th>no</th>
                <th>nama mahasiswa</th>
                <th>nilai uts</th>
                <th>nilai uas</th>
                <th>nilai akhir</th>
                <th>grade</th>
            </tr>
        </thead>

        <!-- isi data -->
         <tbody>
            <tr>
                <td>1</td>
                <td>syarfani</td>
                <td>80</td>
                <td>85</td>
                <td>82.5</td>
                <td>A</td>
            </tr>
            <tr>
                <td>2</td>
                <td>fika</td>
                <td>75</td>
                <td>70</td>
                <td>72.5</td>
                <td>B</td>
            </tr>
            <tr>
                <td>3</td>
                <td>tini</td>
                <td>90</td>
                <td>88</td>
                <td>89</td>
                <td>A</td>
            </tr>
            <tr>
                <td>4</td>
                <td>faris</td>
                <td>65</td>
                <td>70</td>
                <td>67.7</td>
                <td>C</td>
            </tr>
            <tr>
                <td>5</td>
                <td>nopal</td>
                <td>85</td>
                <td>80</td>
                <td>82.5</td>
                <td>A</td>
            </tr>
        </tbody>

        <!-- footer (rata-rata) -->
         <tfoot>
            <tr>
                <td colspan="2"><b>rata-rata</b>/td>
                <td>79</td>
                <td>78.6</td>
                <td>78.8</td>
                <td>-</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
