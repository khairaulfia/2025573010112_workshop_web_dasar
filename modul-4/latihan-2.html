<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komponen UI Lanjutan</title>
    <link rel="stylesheet" href="latihan-2.css">
</head>
<body>

    <h2>Accordion / FAQ</h2>
    <div class="faq">
        <details>
            <summary>Apa itu HTML?</summary>
            <p>HTML adalah bahasa dasar untuk membuat struktur website.</p>
        </details>

        <details>
            <summary>Apa itu CSS?</summary>
            <p>CSS digunakan untuk mengatur tampilan website.</p>
        </details>

        <details>
            <summary>Apa itu JavaScript?</summary>
            <p>JavaScript digunakan untuk membuat website interaktif.</p>
        </details>
    </div>

    <h2>Image Hover Overlay</h2>
    <div class="gallery">
        <div class="img-box"><img src="https://picsum.photos/300?1"></div>
        <div class="img-box"><img src="https://picsum.photos/300?2"></div>
        <div class="img-box"><img src="https://picsum.photos/300?3"></div>
        <div class="img-box"><img src="https://picsum.photos/300?4"></div>
    </div>

    <h2>Progress Bar</h2>
    <div class="progress" style="--progress: 75%">HTML</div>
    <div class="progress" style="--progress: 50%">CSS</div>
    <div class="progress" style="--progress: 30%">JavaScript</div>

</body>
</html>
