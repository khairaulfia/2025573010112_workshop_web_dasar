<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="latihan-1.css">
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <header class="header">
        <h1>Dashboard Admin</h1>
    </header>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h3>Menu</h3>
        <ul>
            <li>Dashboard</li>
            <li>User</li>
            <li>Laporan</li>
            <li>Setting</li>
        </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">

        <!-- STAT CARDS -->
        <div class="cards">
            <div class="card">User: 120</div>
            <div class="card">Order: 80</div>
            <div class="card">Revenue: 5jt</div>
            <div class="card">Visitor: 300</div>
        </div>

        <!-- CONTENT BOTTOM -->
        <div class="content-bottom">
            <div class="table">Tabel Data</div>
            <div class="chart">Grafik</div>
        </div>

    </main>

</div>

</body>
</html>
