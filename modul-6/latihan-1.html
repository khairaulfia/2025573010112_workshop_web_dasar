<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Sederhana</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .kalkulator {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 280px;
    }

    .display {
      width: 100%;
      height: 60px;
      border: none;
      background: #e5e7eb;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: right;
      font-size: 24px;
      padding: 10px;
      box-sizing: border-box;
    }

    .tombol {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #d1d5db;
      transition: 0.2s;
    }

    button:hover {
      background: #9ca3af;
      color: white;
    }

    .operator {
      background: #f59e0b;
      color: white;
    }

    .hasil {
      background: #10b981;
      color: white;
    }

    .clear {
      background: #ef4444;
      color: white;
    }
  </style>
</head>

<body>

<div class="kalkulator">

  <input type="text" class="display" id="display" readonly>

  <div class="tombol" id="container-tombol">

    <button class="clear" data-value="C">C</button>
    <button class="operator" data-value="/">÷</button>
    <button class="operator" data-value="*">×</button>
    <button class="operator" data-value="-">-</button>

    <button data-value="7">7</button>
    <button data-value="8">8</button>
    <button data-value="9">9</button>
    <button class="operator" data-value="+">+</button>

    <button data-value="4">4</button>
    <button data-value="5">5</button>
    <button data-value="6">6</button>
    <button class="hasil" data-value="=">=</button>

    <button data-value="1">1</button>
    <button data-value="2">2</button>
    <button data-value="3">3</button>
    <button data-value=".">.</button>

    <button style="grid-column: span 4;" data-value="0">0</button>

  </div>
</div>

<script src="latihan-1.js"></script>

</body>
</html>
